<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>職員メニュー</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/responsive.css}">
	<link rel="stylesheet" th:href="@{/css/staff-menu.css}">
</head>
<body>
	<div th:replace="~{fragments/header :: header}"></div>
	<main class="staff-menu-container">
		<div class="menu-list">
		<!--adminはアカウント管理のみに変更-->
			<ul>
		<!--		仮-->
				<li>
					<a href="/staff/reservations">祈願予約<br>
						<span class="menu-count">
							本日の未祈願：<span th:text="${todayUnprayedCount}">0</span>件　
							祈願済：<span th:text="${todayPrayedCount}">0</span>件
						</span>
					</a></li>
				<li><a href="#">授与品郵送</a></li>
				<li><a href="#">崇敬者管理</a></li>
				<li><a href="#">スケジュール</a></li>
				<li><a href="#">在庫管理</a></li>
				<li><a href="#">出納帳</a></li>
				<li><a href="#">祭典出席</a></li>
				<li><a href="/reservations/new">祈願登録フォーム</a></li>
		<!--		<li th:if="${session.loginUser.admin}"><a href="#">職員アカウント管理</a></li>-->
		    </ul>

		</div>
		<section class="free-area2">
			<p id="todayBox"></p>
			<p th:if="${errorMsg}" th:text="${errorMsg}"></p>	
		</section>
		
		<section class="calendar-area">
			<div id="staffCalendar"></div>
		</section>
		
		<section class="notice-area">
			<h2>掲示板</h2>
			<div class="notice-list">
				<div th:if="${#lists.isEmpty(notices)}">
					<p>まだ投稿はありません。</p>
				</div>
	
				<article th:each="notice : ${notices}" class="notice-card">
					<h3 th:text="${notice.title}">タイトル</h3>
	
					<p class="notice-content" th:text="${notice.content}">
						本文
					</p>
					
					<p class="notice-meta">
						投稿者：
						<span th:text="${notice.staffAccount.staffName}">職員名</span>
					</p>
	
					<p class="notice-meta">
						投稿日：
						<span th:text="${#temporals.format(notice.createdAt, 'yyyy/MM/dd HH:mm')}">
						2026/07/04 12:00
					</span>
					</p>
	
				</article>
			</div>
			<div class="notice-form">
				<form th:action="@{/staff/notices/create}" method="post" th:object="${notice}">
					<div class="form-group">
						<label for="title"></label>
						<input type="text" id="title" th:field="*{title}" placeholder="例：明日の祈願受付について" required>
					</div>
	
					<div class="notice-content-row">
						<label for="content"></label>
						<textarea id="content" th:field="*{content}" rows="4" placeholder="例：明日は10時より団体祈願があります。受付時に確認をお願いします。" required></textarea>
						<button type="submit" class="notice-submit-button">投稿する</button>
					</div>
				</form>
			</div>
		</section>
		<section class="news-area">
			<h2>ニュース</h2>
			<p>jsoupで業界情報をスクレイピングしたい</p>
		</section>

		<!-- 下中央：自由枠 -->
		<section class="free-area">
			<h2>なんか入れたい</h2>
		</section>

		

	</main>
	<script th:src="@{/js/today.js}"></script>
	<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
	<script th:src="@{/js/staff-calendar.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>崇敬者管理</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>崇敬者管理</h1>
	<p th:if="${errorMsg}"
	   th:text="${errorMsg}">
	</p>

    <section>
        <h2>崇敬者登録</h2>

        <form th:action="@{/staff/supporterManagement/create}"
              method="post"
              th:object="${supporter}">

            <label for="supporterNumber">崇敬者番号</label>
            <input type="text" id="supporterNumber" th:field="*{supporterNumber}" required>

            <label for="supporterType">区分</label>
            <select id="supporterType" th:field="*{supporterType}" required>
                <option value="">選択</option>
                <option value="INDIVIDUAL">個人</option>
                <option value="CORPORATION">法人</option>
            </select>

            <label for="name">氏名・法人名</label>
            <input type="text" id="name" th:field="*{name}" required>

            <label for="kana">ふりがな</label>
            <input type="text" id="kana" th:field="*{kana}">

			<div class="corporate-field">
			    <label for="corporateType">法人種別</label>
			    <select id="corporateType" th:field="*{corporateType}">
			        <option value="">選択</option>
			        <option value="株式会社">株式会社</option>
			        <option value="有限会社">有限会社</option>
			        <option value="合同会社">合同会社</option>
			        <option value="一般社団法人">一般社団法人</option>
			        <option value="一般財団法人">一般財団法人</option>
			        <option value="公益社団法人">公益社団法人</option>
			        <option value="公益財団法人">公益財団法人</option>
			        <option value="社会福祉法人">社会福祉法人</option>
			        <option value="学校法人">学校法人</option>
			        <option value="医療法人">医療法人</option>
			        <option value="宗教法人">宗教法人</option>
			        <option value="その他">その他</option>
			    </select>
			</div>

			<div class="corporate-field">
			    <label for="representativeName">代表者名</label>
			    <input type="text" id="representativeName" th:field="*{representativeName}">
			</div>
			
			<div class="corporate-field">
			    <label for="contactPerson">担当者名</label>
			    <input type="text" id="contactPerson" th:field="*{contactPerson}">
			</div>

			<div class="individual-field">
			    <label for="birthday">生年月日</label>
			    <input type="date" id="birthday" th:field="*{birthday}">
			</div>
           

            <label for="postalCode">郵便番号</label>
            <input type="text" id="postalCode" th:field="*{postalCode}">

            <label for="address">住所</label>
            <input type="text" id="address" th:field="*{address}">

            <label for="addressKana">住所ふりがな</label>
            <input type="text" id="addressKana" th:field="*{addressKana}">

            <label for="phone">電話番号</label>
            <input type="text" id="phone" th:field="*{phone}">

            <label for="email">メールアドレス</label>
            <input type="email" id="email" th:field="*{email}">

            <label for="registeredDate">登録日</label>
            <input type="date" id="registeredDate" th:field="*{registeredDate}">

            <label for="note">備考</label>
            <textarea id="note" th:field="*{note}" rows="3"></textarea>

            <button type="submit">登録</button>
        </form>
    </section>

    <section>
        <h2>崇敬者一覧</h2>

        <form th:action="@{/staff/supporterManagement}" method="get">
            <label for="filterSupporterType">区分</label>

            <select id="filterSupporterType" name="supporterType">
                <option value=""
                        th:selected="${supporterType == null or supporterType == ''}">
                    すべて
                </option>
                <option value="INDIVIDUAL"
                        th:selected="${supporterType == 'INDIVIDUAL'}">
                    個人
                </option>
                <option value="CORPORATION"
                        th:selected="${supporterType == 'CORPORATION'}">
                    法人
                </option>
            </select>

            <button type="submit">表示</button>
        </form>

        <p th:if="${#lists.isEmpty(supporters)}">
            登録されている崇敬者はいません。
        </p>

        <table th:if="${!#lists.isEmpty(supporters)}" border="1">
            <thead>
            <tr>
                <th>番号</th>
                <th>区分</th>
                <th>氏名・法人名</th>
                <th>ふりがな</th>
                <th>法人種別</th>
                <th>電話番号</th>
                <th>住所</th>
                <th>登録日</th>
                <th>操作</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="supporter : ${supporters}">
                <td th:text="${supporter.supporterNumber}">S0001</td>

                <td th:text="${supporter.supporterType == 'INDIVIDUAL' ? '個人' : '法人'}">
                    個人
                </td>

                <td th:text="${supporter.name}">氏名</td>
                <td th:text="${supporter.kana}">ふりがな</td>
                <td th:text="${supporter.corporateType}">株式会社</td>
                <td th:text="${supporter.phone}">000-0000-0000</td>
                <td th:text="${supporter.address}">住所</td>
                <td th:text="${supporter.registeredDate}">2026-07-12</td>

                <td>
                    <a th:href="@{/staff/supporterManagement/{id}/edit(id=${supporter.id})}">
                        編集
                    </a>

                    <form th:action="@{/staff/supporterManagement/{id}/delete(id=${supporter.id})}"
                          method="post"
                          style="display:inline">
                        <button type="submit"
                                onclick="return confirm('無効にしますか？');">
                            無効
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

    <a th:href="@{/staff}">職員メニューへ戻る</a>
</main>
<script th:src="@{/js/supporter.js}"></script>
</body>
</html>

```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>崇敬者編集</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h1>崇敬者編集</h1>

    <form th:action="@{/staff/supporterManagement/{id}/update(id=${supporter.id})}"
          method="post"
          th:object="${supporter}">

        <label for="supporterNumber">崇敬者番号</label>
        <input type="text" id="supporterNumber" th:field="*{supporterNumber}" required>

        <label for="supporterType">区分</label>
        <select id="supporterType" th:field="*{supporterType}" required>
            <option value="INDIVIDUAL">個人</option>
            <option value="CORPORATION">法人</option>
        </select>

        <label for="name">氏名・法人名</label>
        <input type="text" id="name" th:field="*{name}" required>

        <label for="kana">ふりがな</label>
        <input type="text" id="kana" th:field="*{kana}">

        <label for="corporateType">法人種別</label>
        <select id="corporateType" th:field="*{corporateType}">
            <option value="">選択</option>
            <option value="株式会社">株式会社</option>
            <option value="有限会社">有限会社</option>
            <option value="合同会社">合同会社</option>
            <option value="一般社団法人">一般社団法人</option>
            <option value="一般財団法人">一般財団法人</option>
            <option value="公益社団法人">公益社団法人</option>
            <option value="公益財団法人">公益財団法人</option>
            <option value="社会福祉法人">社会福祉法人</option>
            <option value="学校法人">学校法人</option>
            <option value="医療法人">医療法人</option>
            <option value="宗教法人">宗教法人</option>
            <option value="その他">その他</option>
        </select>

        <label for="representativeName">代表者名</label>
        <input type="text" id="representativeName" th:field="*{representativeName}">

        <label for="contactPerson">担当者名</label>
        <input type="text" id="contactPerson" th:field="*{contactPerson}">

        <label for="birthday">生年月日</label>
        <input type="date" id="birthday" th:field="*{birthday}">

        <label for="postalCode">郵便番号</label>
        <input type="text" id="postalCode" th:field="*{postalCode}">

        <label for="address">住所</label>
        <input type="text" id="address" th:field="*{address}">

        <label for="addressKana">住所ふりがな</label>
        <input type="text" id="addressKana" th:field="*{addressKana}">

        <label for="phone">電話番号</label>
        <input type="text" id="phone" th:field="*{phone}">

        <label for="email">メールアドレス</label>
        <input type="email" id="email" th:field="*{email}">

        <label for="registeredDate">登録日</label>
        <input type="date" id="registeredDate" th:field="*{registeredDate}">

        <label for="note">備考</label>
        <textarea id="note" th:field="*{note}" rows="3"></textarea>

        <button type="submit">更新</button>
    </form>

    <a th:href="@{/staff/supporterManagement}">崇敬者一覧へ戻る</a>
</main>

</body>
</html>
```
